const clean = v => String(v??"").trim().replace(/\.0$/,"");
/* A response with no hidden fields counts as Madrid (it was submitted during the Madrid run and the Madrid tab includes it) */
function resolveCity(r){const p=PLAN_MAP[clean(r[C.idp])];if(p)return p.split(" (")[0];return CITY_MAP[clean(r[C.c])]||"Madrid";}
function resolveCountry(r){const p=PLAN_MAP[clean(r[C.idp])];if(p)return p.match(/\(([^)]+)\)/)[1];return COUNTRY_MAP[clean(r[C.ct])]||"Spain";}
function resolveAudience(r){return FF_PLANS.includes(clean(r[C.idp]))||clean(r[C.c])==="21"?"Friends & family":"Public";}

/* ── CSV parser ──────────────────────────────────────────── */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){if(ch==='"'&&nx==='"'){cell+='"';i++;}else if(ch==='"')inQ=false;else cell+=ch;}
    else{if(ch==='"')inQ=true;else if(ch===','){row.push(cell);cell="";}
    else if(ch==='\n'||(ch==='\r'&&nx==='\n')){row.push(cell);cell="";if(row.some(c=>c.trim()))rows.push(row);row=[];if(ch==='\r')i++;}
    else cell+=ch;}
  }
  if(cell||row.length){row.push(cell);if(row.some(c=>c.trim()))rows.push(row);}
  return rows;
}

/* ── gauges ──────────────────────────────────────────────── */
const RSEG=[{from:1,to:3.8,color:"#E24B4A"},{from:3.8,to:4.2,color:"#EF9F27"},{from:4.2,to:5,color:"#1D9E75"}];
const CSEG=[{from:1,to:2,color:"#E24B4A"},{from:2,to:2.5,color:"#EF9F27"},{from:2.5,to:3.5,color:"#1D9E75"},{from:3.5,to:4,color:"#EF9F27"},{from:4,to:5,color:"#E24B4A"}];
function v2a(v,mn,mx){return Math.PI-((v-mn)/(mx-mn))*Math.PI;}
function arcD(cx,cy,r,a1,a2){
  const x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy-r*Math.sin(a2);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${Math.abs(a2-a1)>Math.PI?1:0} ${a1>a2?1:0} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function gauge(avgVal,n,segs,mn,mx,endLbls){
  const cx=120,cy=118,r=80,sw=22;
  const paths=segs.map(s=>`<path d="${arcD(cx,cy,r,v2a(s.from,mn,mx),v2a(s.to,mn,mx))}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt"/>`).join("");
  const tvs=mx===10?[1,2,4,6,8,9,10]:[1,2,3,4,5];
  const ticks=tvs.map(v=>{const a=v2a(v,mn,mx),tr=r+sw+12;return `<text x="${(cx+tr*Math.cos(a)).toFixed(1)}" y="${(cy-tr*Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#bbb">${v}</text>`;}).join("");
  let ndl="";
  if(avgVal!==null){const a=v2a(avgVal,mn,mx),nr=r-sw*.5-3,nx=cx+nr*Math.cos(a),ny=cy-nr*Math.sin(a),deg=(Math.PI-a)*(180/Math.PI)+90;ndl=`<polygon points="0,-10 6,0 -6,0" fill="#555" transform="translate(${nx.toFixed(1)},${ny.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;}
  const el=endLbls?`<text x="${(cx+(r+sw+30)*Math.cos(Math.PI)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(Math.PI)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[0]}</text><text x="${(cx+(r+sw+30)*Math.cos(0)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(0)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[1]}</text>`:"";
  const as=avgVal!==null?avgVal.toFixed(2):"–";
  return `<svg viewBox="0 0 240 158" width="240" height="158">${paths}${ticks}${ndl}${el}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1916">${as}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#bbb">${avgVal!==null?`n = ${n}`:"no data"}</text></svg>`;
}

/* ── charts ──────────────────────────────────────────────── */

/* ── helpers ─────────────────────────────────────────────── */
function tryNum(v){const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;}
function avg(a){const ns=a.filter(v=>v!==null);return ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:null;}
function freq(arr){const m={};arr.forEach(v=>{if(v&&v.trim())m[v.trim()]=(m[v.trim()]||0)+1;});return m;}
function uniq(arr){return[...new Set(arr.filter(Boolean))].sort();}
function sorted(m,n=10){return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}


function opts(v){
  const s=String(v??"").trim(); if(!s) return {found:[],other:null};
  const found=[...s.matchAll(/\*([^*]+)\*/g)].map(m=>m[1].trim());
  const rest=s.replace(/\*[^*]+\*/g,"").replace(/^[\s,]+|[\s,]+$/g,"").trim();
  return {found, other: rest||null};
}
function catMulti(rows,i){const out=[];rows.forEach(r=>{const o=opts(r[i]);out.push(...o.found);if(o.other)out.push("Other (written in)");});return out;}
function catSingle(rows,i){return rows.map(r=>{const o=opts(r[i]);return o.found[0]||(o.other?"Other (written in)":null);}).filter(Boolean);}
function wrapL(s,n=24){const w=String(s).split(" "),out=[];let cur="";w.forEach(x=>{if((cur+" "+x).trim().length>n&&cur){out.push(cur);cur=x;}else cur=(cur+" "+x).trim();});if(cur)out.push(cur);return out.length>1?out:s;}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ── open text translation ───────────────────────────────── */
async function translateComment(text) {
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const lang = data[2];
    if(lang === 'en') return null;
    const translated = data[0].map(s=>s[0]).join('');
    return translated;
  } catch(e) { return null; }
}

async function translateColumn(btnEl, containerId) {
  btnEl.textContent = 'Translating…';
  btnEl.disabled = true;
  const items = document.querySelectorAll(`#${containerId} .comi`);
  for(const item of items) {
    if(item.dataset.translated) continue;
    const original = item.textContent.trim();
    if(!original) continue;
    const translation = await translateComment(original);
    if(translation) {
      item.innerHTML = `${translation}<div style="font-size:11px;color:var(--faint);margin-top:3px;font-style:italic">${original}</div>`;
    }
    item.dataset.translated = '1';
  }
  btnEl.textContent = 'Translated';
}


function barPair(id,labels,a,b,la,lb){
  const ctx=document.getElementById(id);if(!ctx)return;
  CR.push(new Chart(ctx,{type:"bar",
    data:{labels,datasets:[{label:la,data:a,backgroundColor:"#1D9E75",borderRadius:4,borderSkipped:false},{label:lb,data:b,backgroundColor:"#E24B4A",borderRadius:4,borderSkipped:false}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:"bottom",labels:{color:"#7a776e",font:{size:11},boxWidth:12}}},
      scales:{x:{grid:{display:true},ticks:{color:"#7a776e",font:{size:11},precision:0},beginAtZero:true},y:{grid:{display:false},ticks:{color:"#7a776e",font:{size:11}}}}}}));
}

/* ── column lookup by header ─────────────────────────────── */
let ROWS=[],HDRS=[],C={},SOURCE="";
function findCol(re,fallback,nth=0){const hits=HDRS.map((h,i)=>[String(h).replace(/\*/g,"").replace(/\s+/g," "),i]).filter(([h])=>re.test(h));return hits[nth]?hits[nth][1]:fallback;}
function buildColumns(){
  C={
    rec:findCol(/would you recommend/i,0), comp:findCol(/attend the experience with anyone/i,1), travel:findCol(/how far did you travel/i,2),
    age:findCol(/what is your age/i,3), appealed:findCol(/appealed to you most/i,4),
    venue:findCol(/rate the venue/i,5), music:findCol(/rate the music/i,6), lighting:findCol(/rate the lighting/i,7), costumes:findCol(/rate the costumes/i,8),
    props:findCol(/stage decoration/i,9), actors:findCol(/rate the actors/i,10), actorsWhy:findCol(/rating of the actors/i,11),
    script:findCol(/rate the script/i,12), scriptWhy:findCol(/rating of the script/i,13),
    favCk:findCol(/story was your favourite/i,14,0), fav:findCol(/story was your favourite/i,15,1), favWhy:findCol(/what did you like about/i,16),
    leastCk:findCol(/story was your least favourite/i,17,0), least:findCol(/story was your least favourite/i,18,1), leastWhy:findCol(/didn't like about/i,19),
    knew:findCol(/already familiar with/i,20), knowImp:findCol(/knowing the characters/i,21),
    duration:findCol(/duration of the experience/i,22), vfm:findCol(/value for money/i,23), exp:findCol(/compare to your expectations/i,24),
    expDiff:findCol(/different from what you expected/i,25), ret:findCol(/return to this experience/i,26),
    liked:findCol(/enjoy the most/i,27), improve:findCol(/most improvement/i,28), overall:findCol(/overall quality of the event/i,29),
    c:findCol(/^c$/,30), ct:findCol(/^ct$/,31), idp:findCol(/^idp$/,33), p:findCol(/^p$/,34), idt:findCol(/^idt$/,35), name:findCol(/^name$/,36),
    sub:findCol(/^submitted at$/i,37), token:findCol(/^token$/i,38),
  };
}
const RATING_DEFS=[{k:"actors",l:"Actors' performance"},{k:"script",l:"Script"},{k:"venue",l:"Venue"},{k:"music",l:"Music"},{k:"lighting",l:"Lighting"},{k:"costumes",l:"Costumes"},{k:"props",l:"Stage decoration & props"}];

function dedupeByToken(rows){
  const seen={},noTok=[];
  const partial=r=>{const s=String(r[C.sub]||"").trim();return !s||s.includes("0001");};
  rows.forEach(r=>{const t=String(r[C.token]||"").trim();if(!t){noTok.push(r);return;}if(!seen[t]||(partial(seen[t])&&!partial(r)))seen[t]=r;});
  return [...Object.values(seen),...noTok];
}

/* ── load ────────────────────────────────────────────────── */
function useRows(rows,src){
  HDRS=rows[0].map(String);buildColumns();
  ROWS=dedupeByToken(rows.slice(1).map(r=>r.map(v=>v==null?"":String(v)))).filter(r=>String(r[C.rec]||"").trim()!==""||String(r[C.token]||"").trim()!=="");
  SOURCE=src;
  const b=document.getElementById("src-badge");b.textContent=src;b.style.display="inline-block";
  populateFilters();renderDashboard();if(ACTIVE_TAB==="comp")renderComparison();
}
async function loadData(){
  const msg=document.getElementById("state-msg");
  if(!SHEET_URL){useRows(SNAPSHOT,`Snapshot · ${SNAPSHOT_DATE}`);return;}
  document.getElementById("refresh-btn").style.display="flex";
  msg.style.display="flex";msg.innerHTML='<div class="spinner"></div><span>Loading data from Google Sheets…</span>';
  try{const res=await fetch(SHEET_URL);if(!res.ok)throw new Error("HTTP "+res.status);const rows=parseCSV(await res.text());if(rows.length<2)throw new Error("empty");useRows(rows,"Live · Google Sheets");}
  catch(e){useRows(SNAPSHOT,`Snapshot · ${SNAPSHOT_DATE} (live load failed)`);}
}
window.addEventListener("load",()=>loadData());

/* ── filters ─────────────────────────────────────────────── */
function fillSelect(selId,vals,fn){
  const sel=document.getElementById(selId),cur=sel.value,keep=vals.includes(cur)?cur:"";
  sel.innerHTML=`<option value="">All</option>`+vals.map(v=>`<option value="${v}"${v===keep?" selected":""}>${v}</option>`).join("");
  sel.disabled=vals.length===0;sel.onchange=fn;  /* stays usable with a single option, so filters keep working as more cities/F&F runs are added */
}
function rerender(){renderDashboard();if(ACTIVE_TAB==="comp")renderComparison();}
function populateFilters(){
  function refresh(first){
    const aud=document.getElementById("f-aud").value,country=document.getElementById("f-country").value;
    fillSelect("f-aud",uniq(ROWS.map(resolveAudience)),()=>refresh());
    const byAud=aud?ROWS.filter(r=>resolveAudience(r)===aud):ROWS;
    fillSelect("f-country",uniq(byAud.map(resolveCountry)),()=>refresh());
    const byCountry=country?byAud.filter(r=>resolveCountry(r)===country):byAud;
    fillSelect("f-city",uniq(byCountry.map(resolveCity)),rerender);
    if(!first)rerender();
  }
  refresh(true);
}
function geoFilter(r){
  const aud=document.getElementById("f-aud").value,country=document.getElementById("f-country").value,city=document.getElementById("f-city").value;
  if(aud&&resolveAudience(r)!==aud)return false;
  if(country&&resolveCountry(r)!==country)return false;
  if(city&&resolveCity(r)!==city)return false;
  return true;
}
function filteredRows(){return ROWS.filter(geoFilter);}

/* ── render ──────────────────────────────────────────────── */
function commentList(title,items,id,translate=true){
  return `<div class="comc">
    <div class="comh" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>${title} (${items.length})</span>
      ${translate?`<button onclick="translateColumn(this,'${id}')" style="font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer">Translate</button>`:""}
    </div>
    <div class="coml" id="${id}">${items.map(c=>`<div class="comi">${c}</div>`).join("")||`<div class="comi" style="color:var(--faint)">No responses</div>`}</div>
  </div>`;
}
function chartCard(id,title,n,note){
  const hh=Math.max(100,n*34+40);
  return `<div class="cc"><div class="ct">${title}</div><div style="position:relative;width:100%;height:${hh}px"><canvas id="${id}"></canvas></div>${note?`<div class="note">${note}</div>`:""}</div>`;
}
function centreSplit(n,el){
  const lo=Math.round(n.filter(v=>v<=2).length/n.length*100),md=Math.round(n.filter(v=>v===3).length/n.length*100),hi=100-lo-md;
  return `<div class="split"><span style="color:${lo>=25?"#A32D2D":"var(--muted)"}">${lo}% ${el[0].toLowerCase()}</span> · ${md}% just right · <span style="color:${hi>=25?"#A32D2D":"var(--muted)"}">${hi}% ${el[1].toLowerCase()}</span></div>`;
}
const ordered=(vals,order)=>{const f=freq(vals);const known=order.filter(k=>f[k]).map(k=>[k,f[k]]);const rest=Object.entries(f).filter(([k])=>!order.includes(k)).sort((a,b)=>b[1]-a[1]);return [...known,...rest];};

function renderDashboard(){
  try{
  destroyCharts();
  const rows=filteredRows();
  document.getElementById("resp-count").textContent=`${rows.length} response${rows.length!==1?"s":""}`;
  document.getElementById("resp-count").style.display="inline-block";
  const audSel=document.getElementById("f-aud").value;
  document.getElementById("dash-sub").textContent=`Post-experience survey · ${rows.length} responses${audSel?" · "+audSel:""}`;

  const col=i=>rows.map(r=>r[i]??"");
  const nums=i=>col(i).map(tryNum).filter(v=>v!==null);
  const ga=i=>{const n=nums(i);return{a:avg(n),n:n.length};};
  const texts=i=>col(i).map(v=>String(v).trim()).filter(Boolean).map(escapeHtml);
  const unit=s=>`<span style="font-size:16px;font-weight:400;color:var(--faint)">${s}</span>`;

  const rn=nums(C.rec),npsN=rn.length;
  const pro=rn.filter(v=>v>=9).length,pas=rn.filter(v=>v>=7&&v<=8).length,det=rn.filter(v=>v<=6).length;
  const npsScore=npsN?Math.round(((pro-det)/npsN)*100):null;
  const recAvg=avg(rn);
  const ov=ga(C.overall),vfm=ga(C.vfm),ex=ga(C.exp),ret=ga(C.ret);
  const ffN=rows.filter(r=>resolveAudience(r)==="Friends & family").length;

  let h="";
  if(ffN&&ffN<rows.length)h+=`<div class="ff-banner"><b>Includes ${ffN} friends &amp; family responses</b> from the Chicago preview. Set Audience to “Public” to see paying customers only.</div>`;
  h+=`<div class="kpi-strip">`;
  if(npsScore!==null)h+=`<div class="kpi"><div class="kpi-label">NPS</div><div class="kpi-value" style="color:${metricColor(npsScore,"nps")}">${npsScore>0?"+":""}${npsScore}</div><div class="kpi-sub">${npsN} responses</div></div>`;
  h+=`<div class="kpi"><div class="kpi-label">Total responses</div><div class="kpi-value">${rows.length}</div><div class="kpi-sub">${uniq(rows.map(resolveCity)).join(" · ")}</div></div>`;
  if(recAvg!==null)h+=`<div class="kpi"><div class="kpi-label">Recommend</div><div class="kpi-value" style="color:${metricColor(recAvg,"rec")}">${recAvg.toFixed(1)}${unit("/10")}</div><div class="kpi-sub">n = ${npsN}</div></div>`;
  if(ov.a!==null)h+=`<div class="kpi"><div class="kpi-label">Overall quality</div><div class="kpi-value" style="color:${metricColor(ov.a)}">${ov.a.toFixed(1)}${unit("/5")}</div><div class="kpi-sub">n = ${ov.n}</div></div>`;
  if(vfm.a!==null)h+=`<div class="kpi"><div class="kpi-label">Value for money</div><div class="kpi-value" style="color:${metricColor(vfm.a)}">${vfm.a.toFixed(1)}${unit("/5")}</div><div class="kpi-sub">n = ${vfm.n}</div></div>`;
  h+=`</div>`;

  if(npsN){
    const pp=Math.round(pro/npsN*100),pap=Math.round(pas/npsN*100),dp=100-pp-pap;
    h+=`<div class="nps-card"><div class="ct">NPS breakdown</div><div class="nps-bar">
      ${det?`<div class="nps-seg" style="width:${dp}%;background:#A32D2D">${det}</div>`:""}${pas?`<div class="nps-seg" style="width:${pap}%;background:#BA7517">${pas}</div>`:""}${pro?`<div class="nps-seg" style="width:${pp}%;background:#1D9E75">${pro}</div>`:""}
      </div><div class="nps-legs"><span style="color:#A32D2D">Detractors (0–6) · ${dp}%</span><span style="color:#BA7517">Passives (7–8) · ${pap}%</span><span style="color:#1D9E75">Promoters (9–10) · ${pp}%</span></div></div>`;
  }

  h+=`<div class="sh">Overview</div><div class="gg">`;
  if(ov.a!==null)h+=`<div class="gc"><div class="gl">Overall quality of the event</div>${gauge(ov.a,ov.n,RSEG,1,5,null)}</div>`;
  if(ex.a!==null)h+=`<div class="gc"><div class="gl">Experience vs expectations</div>${gauge(ex.a,ex.n,RSEG,1,5,null)}</div>`;
  if(ret.a!==null)h+=`<div class="gc"><div class="gl">Likelihood to return</div>${gauge(ret.a,ret.n,RSEG,1,5,null)}</div>`;
  const dn=nums(C.duration);
  if(dn.length)h+=`<div class="gc"><div class="gl">Duration (3 = just right)</div>${gauge(avg(dn),dn.length,CSEG,1,5,["Too short","Too long"])}${centreSplit(dn,["Too short","Too long"])}</div>`;
  h+=`</div>`;
  const expDiff=sorted(freq(catMulti(rows,C.expDiff)),8);
  if(expDiff.length)h+=`<div class="cg" style="margin-top:14px">${chartCard("expdiff","What was different from what they expected",expDiff.length,"Multi-select, asked to those who rated the experience below their expectations.")}</div>`;

  h+=`<div class="sh">Ratings</div><div class="gg">`;
  RATING_DEFS.forEach(({k,l})=>{const n=nums(C[k]);if(n.length)h+=`<div class="gc"><div class="gl">${l}</div>${gauge(avg(n),n.length,RSEG,1,5,null)}</div>`;});
  h+=`</div>`;
  h+=`<div class="og og-2" style="margin-top:14px">${commentList("About their actors rating",texts(C.actorsWhy),"ol-act")}${commentList("About their script rating",texts(C.scriptWhy),"ol-scr")}</div>`;

  /* Stories */
  const STORY=["Griselda Blanco","Pablo Escobar","Lucky Luciano","Frank Lucas"];
  const favF=freq(catSingle(rows,C.fav)),leastF=freq(catSingle(rows,C.least));
  const sLabels=STORY.filter(s=>favF[s]||leastF[s]).concat(Object.keys({...favF,...leastF}).filter(k=>!STORY.includes(k)));
  const favCk=freq(catSingle(rows,C.favCk)),leastCk=freq(catSingle(rows,C.leastCk));
  const ckLabels=uniq([...Object.keys(favCk),...Object.keys(leastCk)]);
  h+=`<div class="sh">The stories</div><div class="cg">`;
  if(sLabels.length)h+=`<div class="cc"><div class="ct">Favourite vs least favourite story</div><div style="position:relative;width:100%;height:${Math.max(160,sLabels.length*52+60)}px"><canvas id="spair"></canvas></div></div>`;
  if(ckLabels.length)h+=`<div class="cc"><div class="ct">Favourite vs least favourite (F&amp;F version)</div><div style="position:relative;width:100%;height:${Math.max(160,ckLabels.length*52+60)}px"><canvas id="ckpair"></canvas></div><div class="note">The friends &amp; family survey asked by cocktail number rather than character, so these can't be merged with the chart beside it.</div></div>`;
  const knew=ordered(catSingle(rows,C.knew),["I didn’t know any of them","I knew 1","I knew 2","I knew 3","I knew all 4"]);
  const knowImp=ordered(catSingle(rows,C.knowImp),["Yes, definitely","Somewhat","Not really","Not at all"]);
  h+=chartCard("knew","Characters they already knew",knew.length);
  h+=chartCard("knowimp","Is knowing the characters important to enjoy it?",knowImp.length);
  h+=`</div>`;
  h+=`<div class="og og-2" style="margin-top:14px">${commentList("What they liked about their favourite",texts(C.favWhy),"ol-fav")}${commentList("What they didn't like about their least favourite",texts(C.leastWhy),"ol-least")}</div>`;

  /* Open */
  h+=`<div class="sh">Open responses</div><div class="og og-2">${commentList("What they enjoyed most",texts(C.liked),"ol-liked")}${commentList("What needs the most improvement",texts(C.improve),"ol-improve")}</div>`;

  /* Audience */
  const AGE=["18-24","25-34","35-44","45-54","55-64","65+"],TRAVEL=["0-30 mins","30-60 mins","1-2 hours","2+ hours"];
  const audDefs=[
    {id:"aud0",l:"Who they came with",f:sorted(freq(catMulti(rows,C.comp)),8),note:"Multi-select."},
    {id:"aud1",l:"Age group",f:ordered(catSingle(rows,C.age),AGE)},
    {id:"aud2",l:"Travel time",f:ordered(catSingle(rows,C.travel),TRAVEL)},
    {id:"aud3",l:"What appealed most",f:sorted(freq(catMulti(rows,C.appealed)),10),note:"Multi-select."},
  ];
  h+=`<div class="sh">Audience</div><div class="cg">`;
  audDefs.forEach(({id,l,f,note})=>{h+=chartCard(id,l,f.length,note);});
  h+=`</div>`;
  h+=`<div class="last-updated">${SOURCE} · rendered ${new Date().toLocaleString()}</div>`;

  const dash=document.getElementById("dashboard");
  dash.innerHTML=h;document.getElementById("state-msg").style.display="none";
  dash.style.display=ACTIVE_TAB==="dash"?"block":"none";

  if(expDiff.length)bar("expdiff",expDiff.map(([k])=>wrapL(k,30)),expDiff.map(([,v])=>v),"#185FA5",true);
  if(sLabels.length)barPair("spair",sLabels,sLabels.map(l=>favF[l]||0),sLabels.map(l=>leastF[l]||0),"Favourite","Least favourite");
  if(ckLabels.length)barPair("ckpair",ckLabels,ckLabels.map(l=>favCk[l]||0),ckLabels.map(l=>leastCk[l]||0),"Favourite","Least favourite");
  bar("knew",knew.map(([k])=>k),knew.map(([,v])=>v),"#185FA5",true);
  bar("knowimp",knowImp.map(([k])=>k),knowImp.map(([,v])=>v),"#185FA5",true);
  audDefs.forEach(({id,f})=>bar(id,f.map(([k])=>wrapL(k)),f.map(([,v])=>v),"#185FA5",true));
  }catch(err){
    const m=document.getElementById("state-msg");
    m.innerHTML=`<div style="color:#A32D2D;font-weight:500">Render error: ${err.message}</div><pre style="font-size:11px;color:#7a776e;max-width:700px;white-space:pre-wrap;margin-top:8px">${err.stack}</pre>`;
    m.style.display="flex";m.style.flexDirection="column";m.style.gap="8px";document.getElementById("dashboard").style.display="none";
  }
}

let ACTIVE_TAB="dash";
function switchTab(tab){
  ACTIVE_TAB=tab;
  ["dash","comp"].forEach(t=>{document.getElementById("tab-"+t).style.background=tab===t?"var(--text)":"var(--surface)";document.getElementById("tab-"+t).style.color=tab===t?"var(--surface)":"var(--muted)";});
  document.getElementById("dashboard").style.display=tab==="dash"?"block":"none";
  document.getElementById("comparison").style.display=tab==="comp"?"block":"none";
  if(tab==="comp"&&ROWS.length)renderComparison();
}

function metricColor(val, type) {
  if(val===null) return '#b8b5ad';
  if(type==='nps')    return val>=50?'#1D9E75':val>=0?'#EF9F27':'#E24B4A';
  if(type==='rec')    return val>=9?'#1D9E75':val>=7?'#EF9F27':'#E24B4A';
  if(type==='centre') {
    // 3 is perfect, green 2.5-3.5, amber 2-2.5 and 3.5-4, red outside
    const d = Math.abs(val - 3);
    return d<=0.5?'#1D9E75':d<=1?'#EF9F27':'#E24B4A';
  }
  // standard 1-5 higher is better
  return val>=4.2?'#1D9E75':val>=3.8?'#EF9F27':'#E24B4A';
}


  function relColor(val, allVals, isCentre, isNps, isRec) {
    if(val===null) return {bg:'transparent',fg:'var(--faint)'};
    const valid=allVals.filter(v=>v!==null);
    if(valid.length<2) return {bg:'var(--bg)',fg:'var(--text)'};

    // Absolute thresholds
    function isGood(v)  {
      if(isCentre) return Math.abs(v-3)<=0.5;
      if(isNps)    return v>=50;
      if(isRec)    return v>=8;   // 8-10 = green
      return v>=4.2;
    }
    function isOk(v) {
      if(isCentre) return Math.abs(v-3)<=1;
      if(isNps)    return v>=0;
      if(isRec)    return v>=6;   // 6-7 = amber
      return v>=3.8;
    }

    const anyGood  = valid.some(isGood);
    const anyBad   = valid.some(v=>!isOk(v));

    // Relative score within group
    const score = v => isCentre ? -Math.abs(v-3) : v;
    const scores = valid.map(score);
    const mn=Math.min(...scores), mx=Math.max(...scores);
    const t = mx===mn ? 0.5 : (score(val)-mn)/(mx-mn); // 0=worst, 1=best

    let r,g,b;
    if(!anyGood) {
      // All bad -- red spectrum only (dark red to light red)
      const u = t; // 0=darkest red, 1=lightest red
      r=Math.round(180+u*30); g=Math.round(60+u*80); b=Math.round(60+u*80);
    } else if(!anyBad) {
      // All good -- green spectrum only (light green to dark green)
      const u = t;
      r=Math.round(130-u*100); g=Math.round(150+u*50); b=Math.round(100+u*17);
    } else {
      // Mixed -- full red/amber/green but capped by absolute threshold
      if(isGood(val)) {
        // Green zone: lightest green (just above threshold) to darkest green (best)
        const greenVals = valid.filter(isGood);
        const gScores = greenVals.map(score);
        const gMn=Math.min(...gScores), gMx=Math.max(...gScores);
        const gt = gMx===gMn ? 1 : (score(val)-gMn)/(gMx-gMn);
        r=Math.round(100-gt*70); g=Math.round(158+gt*42); b=Math.round(100+gt*17);
      } else if(isOk(val)) {
        // Amber zone
        r=239; g=159; b=39;
      } else {
        // Red zone: light red (just below ok) to dark red (worst)
        const badVals = valid.filter(v=>!isOk(v));
        const bScores = badVals.map(score);
        const bMn=Math.min(...bScores), bMx=Math.max(...bScores);
        const bt = bMx===bMn ? 0 : (score(val)-bMn)/(bMx-bMn);
        r=Math.round(220-bt*40); g=Math.round(80+bt*40); b=Math.round(74+bt*40);
      }
    }
    const brightness = 0.299*r + 0.587*g + 0.114*b;
    const fg = brightness < 140 ? '#fff' : '#333';
    return {bg:`rgb(${r},${g},${b})`,fg};
  }

  function fmtVal(val, isNps) {
    if(val===null) return '–';
    if(isNps) return (val>0?'+':'')+val;
    return val.toFixed(1);
  }


const metricDefs=[
  {key:"nps",label:"NPS",isNps:true},{key:"rec",label:"Rec /10",isRec:true},{key:"overall",label:"Overall"},{key:"vfm",label:"VFM /5"},
  {key:"exp",label:"Expectations"},{key:"ret",label:"Return"},{key:"actors",label:"Actors"},{key:"script",label:"Script"},
  {key:"venue",label:"Venue"},{key:"music",label:"Music"},{key:"lighting",label:"Lighting"},{key:"costumes",label:"Costumes"},{key:"props",label:"Props"},
  {key:"duration",label:"Duration",centre:true},
];
function calcMetrics(rows){
  const n=i=>rows.map(r=>tryNum(r[i])).filter(v=>v!==null);
  const rn=n(C.rec),pro=rn.filter(v=>v>=9).length,det=rn.filter(v=>v<=6).length;
  const m={nps:rn.length?Math.round(((pro-det)/rn.length)*100):null,rec:avg(rn),count:rows.length};
  metricDefs.filter(d=>!d.isNps&&!d.isRec).forEach(d=>{m[d.key]=avg(n(C[d.key]));});
  return m;
}
function renderComparison(){
  const groups={};
  ROWS.forEach(r=>{if(!geoFilter(r))return;const k=resolveCity(r)+"|"+resolveAudience(r);(groups[k]=groups[k]||[]).push(r);});
  const list=Object.entries(groups).map(([k,rows])=>{const [city,aud]=k.split("|");return {city,aud,country:resolveCountry(rows[0]),m:calcMetrics(rows)};}).sort((a,b)=>(b.m.nps??-999)-(a.m.nps??-999));
  if(!list.length){document.getElementById("comparison").innerHTML='<p style="padding:40px;color:var(--muted);text-align:center">No data.</p>';return;}
  const fmtVal=(v,isNps)=>v===null?"–":isNps?(v>0?"+":"")+v:v.toFixed(1);
  let t=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;font-size:13px;line-height:1.6">Madrid is the public run. Chicago was a friends &amp; family preview, so its scores are likely to be kinder than a paying audience's. Use it as a rough comparison only.</div>`;
  t+=`<div style="overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="border-bottom:2px solid var(--border)">
    <th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">City</th><th style="padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted)">n</th>`;
  metricDefs.forEach(m=>{t+=`<th style="text-align:center;padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap">${m.label}</th>`;});
  t+=`</tr></thead><tbody>`;
  list.forEach(p=>{
    t+=`<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px 14px;font-weight:500;white-space:nowrap">${p.city}<br><span style="font-size:11px;color:var(--faint);font-weight:400">${p.country} · ${p.aud}</span></td><td style="padding:10px 8px;text-align:center;color:var(--muted);font-size:12px">${p.m.count}</td>`;
    metricDefs.forEach(m=>{const v=p.m[m.key];const {bg,fg}=relColor(v,list.map(q=>q.m[m.key]),!!m.centre,!!m.isNps,!!m.isRec);t+=`<td style="padding:10px 8px;text-align:center;font-weight:600;background:${bg};color:${fg}">${fmtVal(v,m.isNps)}</td>`;});
    t+=`</tr>`;
  });
  t+=`</tbody></table></div><div style="font-size:11px;color:var(--muted);text-align:right;margin-top:10px">Duration: 3 = just right</div>`;
  document.getElementById("comparison").innerHTML=t;
}
</script>
